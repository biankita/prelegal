[project]
name = "prelegal-backend"
version = "0.1.0"
description = "FastAPI backend for the Prelegal V1 foundation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "pydantic[email]>=2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
